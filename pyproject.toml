[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tssbias"
version = "1.0.0"
description = "Reproducible TSS coverage-bias analyses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "PyYAML==6.0.2",
  "matplotlib==3.9.2",
]

[project.scripts]
tss-bias = "tssbias.cli:main"

[tool.setuptools.packages.find]
include = ["tssbias*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
