name: tss-bias
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - prodigal=2.6.3
  - bowtie2=2.5.4
  - samtools=1.20
  - deeptools=3.5.5
  - kallisto=0.50.1
  - bwa=0.7.18
  - minimap2=2.28
  - megahit=1.2.9
  - metabat2=2.15
  - kraken2=2.1.3
  - art=2016.06.05
  - metaphlan=4.1.0
  - sylph=0.6.1
  - pip
  - pip:
      - -r requirements.txt
# Not pinned here because they are not reliable bioconda packages in this environment:
#   Promotech (set PROMOTECH_HOME to a checkout of the RF-HOT release used in the paper)
#   CheckM2 (optional HQ flag for mag-bias; the command runs without it)
#   Python package "align" providing align.calign and align.matrix.DNAFULL (upstream-scores)
# Prodigal 2.6.3 is the version named in the manuscript. Other versions are the rerun pins,
# not a claim that the original lab binaries matched them. MetaPhlAn 4.1.0 writes
# {data_root}/mpa4_res/<cohort>/merged_mpa.txt. The repository does not ship profiles.
