# Copy to config/gadi.local.yaml and export TSS_CONFIG=$PWD/config/gadi.local.yaml
# Project code comes from TSS_PROJECT or gadi.project. Do not hard-code a
# /groups/cgsd path; durable files live on gdata and BAMs on scratch.

gadi:
  project: ""          # or set TSS_PROJECT=ab12
  queue: normal
  walltime: "24:00:00"
  ncpus: 16
  mem: "64GB"

paths:
  data_root: "/g/data/{project}/tss_bias"
  scratch_root: "/scratch/{project}/tss_bias"
  results_dir: "/g/data/{project}/tss_bias/results"
  refseq_dir: "{data_root}/refseq_genomes"
  bams_dir: "{scratch_root}/bams"
  bigwig_dir: "{scratch_root}/bigwig"
  matrices_dir: "{results_dir}/matrices"
  mpa_merged: "{data_root}/mpa4_res/merged_mpa.txt"
  kallisto_dir: "{results_dir}/kallisto"
  assembled_dir: "{scratch_root}/assembled_ref"
  promotech_dir: "{results_dir}/promotech"
  sketches_dir: "{scratch_root}/sketches"
  pacbio_abundance: "{repo_root}/src/pacbio_merged_mpa.tsv"
  nanopore_abundance: "{repo_root}/src/nanopore_merged_mpa.tsv"

compute:
  threads: 16

analysis:
  seed: 1
  window_bp: 500
  n_permutations: 500
  longread_permutations: 100
  fdr_alpha: 0.05
  tpm_low: 100
  tpm_mid: 1000
  tpm_pseudocount: 0.001
  bowtie2_mp: [8, 6, 4, 2]
  read_length: 150
  five_prime_window: 50
  five_prime_upstream_shift: 10
  five_prime_offsets: [0, 100, 200, 300, 400]
  min_gene_bp_five_prime: 500
  flank_buffer_bp: 5
  longread_min_read_bp: 10000
  longread_subsample: 100000
  longread_min_gene_bp: 1000
  mapq_min: 40
  mag_min_fraction: 80
  mag_hq_completeness: 90
  mag_hq_contamination: 5
  promotech_bp: 100
  promotech_score_threshold: 0.7
  art_args: ["-na", "-ss", "HS25", "-p", "-l", "150", "-c", "500000", "-m200", "-s", "10"]
  correlation_min_pct: 0.5
  correlation_min_samples: 5
  correlation_balance_n: 20

software:
  kraken_db: ""        # directory passed to kraken2 --db
  metaphlan_db: ""     # MetaPhlAn database directory, if not the default
  promotech_home: ""   # directory containing promotech.py; or set PROMOTECH_HOME

figshare:
  project_url: "https://figshare.com/projects/Metagenomic_coverage_bias_at_transcription_start_sites_is_correlated_with_gene_expression/242600"

cohorts:
  hmp2:
    manifest: "{repo_root}/data/manifests/hmp2.tsv"
    fastq_dir: "{data_root}/fastq/hmp2"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 30
    species_set: hmp2
    abundance_table: "{data_root}/mpa4_res/merged_mpa.txt"
    bioproject: PRJNA389280
    paired_rna: true
  franzosa:
    manifest: "{repo_root}/data/manifests/franzosa_rnalater.tsv"
    fastq_dir: "{data_root}/fastq/franzosa"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 5
    species_set: franzosa
    abundance_table: "{data_root}/mpa4_res/merged_mpa.txt"
    bioproject: PRJNA188481
    paired_rna: false
  liu2016:
    display_name: "Liu et al."
    manifest: "{repo_root}/data/manifests/liu2016.tsv"
    fastq_dir: "{data_root}/fastq/liu2016"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 10
    species_set: liu2016
    abundance_table: "{data_root}/mpa4_res/liu2016/merged_mpa.txt"
    bioproject: PRJNA328899
    paired_rna: false
  # Public HMP Phase III stool. See README for the one-run-per-specimen rule.
  hmp3_stool:
    manifest: "{repo_root}/data/manifests/hmp3_stool.tsv"
    fastq_dir: "{data_root}/fastq/hmp3_stool"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 5
    species_set: correlation
    abundance_table: "{data_root}/mpa4_res/hmp3_stool/merged_mpa.txt"
    bioproject: PRJNA275349
    paired_rna: false
  pacbio:
    manifest: "{repo_root}/data/manifests/pacbio.tsv"
    fastq_dir: "{data_root}/fastq/pacbio"
    seq_type: pacbio
    abundance_min_pct: 0.5
    abundance_min_samples: 4
    species_set: longread
    abundance_table: "{repo_root}/src/pacbio_merged_mpa.tsv"
    bioproject: PRJNA754443
    paired_rna: false
  nanopore:
    manifest: "{repo_root}/data/manifests/nanopore.tsv"
    fastq_dir: "{data_root}/fastq/nanopore"
    seq_type: nanopore
    abundance_min_pct: 0.5
    abundance_min_samples: 4
    species_set: longread
    abundance_table: "{repo_root}/src/nanopore_merged_mpa.tsv"
    bioproject: PRJNA820119
    paired_rna: false
  mock:
    display_name: "ATCC MSA-1003"
    manifest: "{repo_root}/data/manifests/mock.tsv"
    fastq_dir: "{data_root}/fastq/mock"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 1
    species_set: mock
    abundance_table: ""
    bioproject: PRJNA510527
    paired_rna: false
  matched:
    manifest: "{repo_root}/data/manifests/matched_longread.tsv"
    fastq_dir: "{data_root}/fastq/matched_longread"
    seq_type: illumina
    abundance_min_pct: 0.5
    abundance_min_samples: 5
    species_set: matched
    abundance_table: "{data_root}/mpa4_res/matched_merged_mpa.txt"
    bioproject: PRJNA820119
    paired_rna: false
